:root{--navy:#0b1220;--sidebar:#111b2e;--surface:#f4f7fb;--card:#fff;--primary:#2563eb;--primary2:#1d4ed8;--teal:#0d9488;--purple:#7c3aed;--orange:#ea580c;--green:#15803d;--red:#b91c1c;--text:#172033;--muted:#64748b;--line:#dce3ed;--soft:#e8eef9;--shadow:0 14px 40px rgba(15,23,42,.08);--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--surface);color:var(--text);font-family:"Segoe UI",Inter,Arial,sans-serif;font-size:16px;line-height:1.58}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}.app{min-height:100vh;display:grid;grid-template-columns:282px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#111b2e 0%,#0b1220 100%);color:#fff;display:flex;flex-direction:column;z-index:40;box-shadow:8px 0 30px rgba(15,23,42,.09)}.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 10px}.brandmark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:27px;font-weight:800;box-shadow:0 8px 24px rgba(37,99,235,.35)}.brandtext{font-weight:800;line-height:1.05;letter-spacing:.05em}.brandtext small{display:block;color:#aab8d0;font-size:11px;letter-spacing:.12em;margin-top:5px}.nav{overflow:auto;padding:8px 10px 22px;scrollbar-width:thin;scrollbar-color:#334155 transparent}.nav h4{margin:18px 10px 7px;color:#8ea0bc;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.navbutton{width:100%;border:0;background:transparent;color:#e5ecf7;text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;margin:1px 0;transition:.16s}.navbutton:hover{background:#22314c}.navbutton.active{background:var(--primary);color:#fff;font-weight:700}.sidefoot{margin-top:auto;padding:12px 18px 18px;color:#8290a8;font-size:11px;border-top:1px solid rgba(255,255,255,.08)}.main{min-width:0}.topbar{height:70px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:30}.menubtn{display:none;border:0;background:#eef2ff;color:var(--text);width:42px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}.pagetitle{font-size:22px;font-weight:800;white-space:nowrap}.databadge{margin-left:auto;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#f1f5f9;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px}.content{max-width:1420px;margin:0 auto;padding:24px 26px 44px}.hero{background:radial-gradient(circle at 85% 20%,rgba(124,58,237,.35),transparent 27%),linear-gradient(130deg,#0b1220,#142847);color:#fff;border-radius:22px;padding:34px 34px 30px;box-shadow:var(--shadow);overflow:hidden}.hero h1{margin:0 0 8px;font-size:clamp(28px,3.5vw,44px);line-height:1.13;max-width:880px}.hero p{margin:0;max-width:900px;color:#c5d0e3;font-size:17px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:.16s}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.btn.primary{background:var(--primary);color:#fff}.btn.teal{background:var(--teal);color:#fff}.btn.purple{background:var(--purple);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.soft{background:#e8eef9;color:var(--text);border:1px solid #d6e0ef}.btn.green{background:var(--green);color:#fff}.btn.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.btn.small{padding:7px 10px;font-size:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.metric,.card,.infocard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 26px rgba(15,23,42,.04)}.metric{text-align:center;padding:18px 12px}.metric strong{display:block;font-size:30px;line-height:1.1}.metric span{color:var(--muted);font-size:13px}.metric:nth-child(1) strong{color:var(--primary)}.metric:nth-child(2) strong{color:var(--purple)}.metric:nth-child(3) strong{color:var(--teal)}.metric:nth-child(4) strong{color:var(--orange)}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.infocard{padding:19px 20px}.infocard h3{margin:0 0 7px;font-size:18px}.infocard p{margin:0;color:#334155}.infocard:nth-child(1) h3{color:var(--primary)}.infocard:nth-child(2) h3{color:var(--teal)}.infocard:nth-child(3) h3{color:var(--purple)}.infocard:nth-child(4) h3{color:var(--orange)}.card{padding:19px;margin:14px 0}.card h2,.card h3{margin-top:0}.card-title{font-weight:800;font-size:18px;margin:0 0 13px}.workflow{font-size:15px;background:linear-gradient(90deg,#eff6ff,#faf5ff);border:1px solid #dbeafe;border-radius:13px;padding:15px 17px}.download-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.download-item{border:1px solid var(--line);border-radius:13px;padding:15px;background:#f8fafc}.download-item strong{display:block;margin-bottom:3px}.download-item code{font-size:12px;color:var(--muted);word-break:break-all}.download-item .btn{margin-top:10px}.download-item .url{display:block;color:#2563eb;font-size:11px;word-break:break-all;margin-top:8px}.section-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}.sticky-card{position:sticky;top:92px}.formgroup{margin:12px 0}.formgroup label{display:block;font-weight:700;font-size:13px;color:#475569;margin-bottom:5px}.input,.select,.textarea{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;color:var(--text);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.textarea{min-height:180px;resize:vertical;font-family:Consolas,monospace}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff;max-height:650px}table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}th,td{border-bottom:1px solid #e8edf4;border-right:1px solid #eef2f7;padding:8px 10px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#e8eef9;color:#1e293b;font-weight:800;z-index:1}tbody tr:nth-child(even){background:#fbfdff}.tool-row{display:flex;flex-wrap:wrap;gap:8px}.note{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;border-radius:11px;padding:11px 13px;font-size:13px}.success-note{background:#ecfdf5;border-color:#a7f3d0;color:#166534}.modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.modalbox{width:min(850px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.25);padding:22px}.modalhead{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}.closebtn{border:0;background:#fee2e2;color:#991b1b;border-radius:9px;width:36px;height:36px;cursor:pointer;font-weight:900}.analysis-output{margin-top:14px}.report-header{background:linear-gradient(135deg,#eff6ff,#faf5ff);border:1px solid #dbeafe;border-radius:14px;padding:18px;margin-bottom:12px}.report-section{border:1px solid var(--line);border-radius:14px;background:#fff;margin:11px 0;overflow:hidden}.report-section h3{margin:0;padding:11px 15px;background:#f8fafc;color:#1e40af;font-size:15px;border-bottom:1px solid var(--line)}.report-body{padding:15px 17px}.report-body p{margin:7px 0}.report-body pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto;font-size:12px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.result-chip{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px}.result-chip small{color:var(--muted);display:block}.result-chip strong{font-size:16px}.guide-hero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;border-radius:20px;padding:28px;margin-bottom:15px}.guide-hero h1{margin:0 0 7px}.guide-hero p{margin:0;color:#dbeafe}.guide-toc{columns:2;column-gap:28px}.guide-toc a{display:block;color:#1d4ed8;text-decoration:none;padding:4px 0;break-inside:avoid}.guide-section{scroll-margin-top:88px}.guide-section>h2{color:#fff;border-radius:11px;padding:11px 14px;font-size:19px;margin-top:22px}.guide-section:nth-of-type(4n+1)>h2{background:var(--primary)}.guide-section:nth-of-type(4n+2)>h2{background:var(--teal)}.guide-section:nth-of-type(4n+3)>h2{background:var(--purple)}.guide-section:nth-of-type(4n)>h2{background:var(--orange)}.method-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:15px;margin:10px 0}.method-card h3{color:#1d4ed8;margin:0 0 8px}.method-card p{margin:5px 0}.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.research-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.research-item strong{display:block}.research-item small{color:var(--muted)}.research-item p{font-size:13px;margin:6px 0}.pill{display:inline-block;border-radius:999px;background:#eef2ff;color:#3730a3;padding:3px 8px;font-size:11px;font-weight:700}.chartbox{min-height:570px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 12px 5px}.loading{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;z-index:200;display:none}.loading.show{display:block}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#0f172a;color:#fff;padding:10px 15px;border-radius:10px;z-index:220;transition:.2s;pointer-events:none;max-width:90vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1050px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;transform:translateX(-103%);transition:.2s;width:282px}.sidebar.open{transform:translateX(0)}.menubtn{display:block}.grid4{grid-template-columns:repeat(2,1fr)}.section-layout{grid-template-columns:1fr}.sticky-card{position:static}.catalog{grid-template-columns:1fr}.databadge{max-width:42%}}
@media(max-width:680px){body{font-size:15px}.topbar{padding:0 12px;height:64px}.pagetitle{font-size:18px}.databadge{display:none}.content{padding:15px 12px 32px}.hero{padding:25px 20px}.grid4,.info-grid,.download-grid,.result-grid{grid-template-columns:1fr}.guide-toc{columns:1}.actions .btn{width:100%}.card{padding:14px}.chartbox{min-height:450px}}
@media print{.sidebar,.topbar,.actions,.btn,.footer{display:none!important}.app{display:block}.content{max-width:none;padding:0}.card,.report-section{box-shadow:none;break-inside:avoid}}

/* Penyesuaian khusus APK Android: area sentuh, safe-area, dan layar kecil/tablet */

  html.android-app .brand{padding-top:14px}

  html.android-app .content{padding-left:10px;padding-right:10px}
  html.android-app .hero{border-radius:16px;padding:20px 16px}

  html.android-app .hero p{font-size:15px}
  html.android-app .card,html.android-app .infocard{border-radius:13px}
  html.android-app table{min-width:560px}

}
@media(min-width:681px) and (max-width:1100px){
  html.android-app .content{padding:20px}
  html.android-app .hero{padding:30px}
}

<body>
<div class="app">
  <aside id="sidebar" class="sidebar">

  <main class="main">

    <div id="content" class="content"></div>

</div>
<div id="pasteModal" class="modal" role="dialog" aria-modal="true"><div class="modalbox"><div class="modalhead"><div><h2 style="margin:0">Tempel Data</h2><div style="color:var(--muted)">Baris pertama harus berisi nama kolom. Tab, koma, dan titik koma dideteksi otomatis.</div></div><button class="closebtn" onclick="closePaste()">×</button></div><textarea id="pasteArea" class="textarea" style="min-height:330px" placeholder="Variabel_A\tVariabel_B\n10\t20"></textarea><div class="actions"><button class="btn primary" onclick="importPastedData()">Impor Data</button><button class="btn soft" onclick="closePaste()">Batal</button></div></div></div>
<input id="fileInput" type="file" hidden accept=".csv,.tsv,.txt,.xlsx,.xls,.json,.statproj">
<div id="loading" class="loading">Memproses…</div><div id="toast" class="toast"></div>
<script>
const METHODS={"descriptive": ["Statistik Deskriptif", "x_optional"], "frequency": ["Tabel Frekuensi", "x"], "cronbach": ["Reliabilitas Cronbach", "predictors"], "normality": ["Uji Normalitas", "x_numeric"], "levene": ["Uji Homogenitas", "x_group"], "t_one": ["Uji t Satu Sampel", "x_reference"], "t_ind": ["Uji t Independen", "x_group"], "t_paired": ["Uji t Berpasangan", "xy_numeric"], "anova": ["ANOVA Satu Arah", "x_group"], "anova2": ["ANOVA Faktorial Dua Arah", "x_factors"], "anova3": ["ANOVA Faktorial Tiga Arah", "x_factors"], "anova4": ["ANOVA Faktorial Empat Arah", "x_factors"], "ancova": ["ANCOVA", "x_group_covariates"], "pearson": ["Korelasi Pearson", "xy_numeric"], "point_biserial": ["Korelasi Point-Biserial", "xy_mixed"], "partial_corr": ["Korelasi Parsial", "xy_controls"], "regression": ["Regresi Linear", "x_predictors"], "poly_regression": ["Regresi Polinomial", "xy_degree"], "nonlinear_regression": ["Regresi Nonlinier", "xy_model"], "logistic_regression": ["Regresi Logistik Biner", "x_predictors_binary"], "pca": ["Principal Component Analysis", "pca"], "mann_whitney": ["Mann–Whitney U", "x_group"], "wilcoxon": ["Wilcoxon Berpasangan", "xy_numeric"], "kruskal": ["Kruskal–Wallis", "x_group"], "friedman": ["Friedman", "predictors"], "spearman": ["Korelasi Spearman", "xy_numeric"], "kendall": ["Korelasi Kendall", "xy_numeric"], "chi_square": ["Chi-Square", "xy_any"], "fisher_exact": ["Fisher Exact", "xy_any"], "mcnemar": ["McNemar Berpasangan", "xy_any"]};
const GUIDES={"descriptive": {"goal": "Mengenali pusat, penyebaran, rentang, dan bentuk distribusi sebelum memilih uji inferensial.", "concept": "N adalah jumlah data valid. Rerata menunjukkan pusat aritmetika, median menunjukkan titik tengah, SD menunjukkan penyebaran, sedangkan skewness dan kurtosis membantu membaca bentuk distribusi.", "read": "Bandingkan rerata dengan median, periksa besar SD relatif terhadap rerata, lalu lihat minimum–maksimum dan kuartil untuk menemukan rentang atau pencilan yang perlu diperiksa."}, "frequency": {"goal": "Mengetahui banyaknya observasi dan persentase pada setiap kategori atau nilai.", "concept": "Frekuensi adalah jumlah kemunculan kategori. Persentase dihitung dengan rumus frekuensi ÷ jumlah seluruh observasi × 100%.", "read": "Kategori dengan frekuensi dan persentase terbesar adalah kategori paling dominan. Baris TOTAL dipakai untuk memeriksa bahwa jumlah frekuensi dan persentase sudah lengkap."}, "cronbach": {"goal": "Menilai konsistensi internal beberapa item yang dimaksudkan mengukur konstruk yang sama.", "concept": "Alpha membandingkan jumlah varians tiap item dengan varians skor total. Secara praktis nilai ≥0,70 sering dianggap memadai, tetapi validitas isi dan tujuan instrumen tetap harus dinilai.", "read": "Periksa varians setiap item, korelasi item-total, dan alpha. Item dengan varians nol atau korelasi item-total sangat rendah perlu ditinjau, bukan langsung dibuang tanpa alasan substantif."}, "normality": {"goal": "Memeriksa apakah distribusi data menunjukkan penyimpangan yang terdeteksi secara statistik dari distribusi normal.", "concept": "H₀ menyatakan data mengikuti distribusi normal. Shapiro–Wilk digunakan sampai 5.000 data; untuk data lebih besar digunakan D’Agostino–Pearson.", "read": "Jika p < α, H₀ normalitas ditolak. Jika p ≥ α, normalitas tidak ditolak; ini bukan bukti mutlak normal, sehingga histogram, Q–Q plot, dan pencilan tetap diperiksa."}, "levene": {"goal": "Memeriksa kesamaan varians antar-kelompok sebagai salah satu asumsi perbandingan parametrik.", "concept": "Versi median menghitung penyimpangan absolut setiap nilai dari median kelompok, kemudian membandingkan penyimpangan tersebut antar-kelompok.", "read": "Jika p < α, varians dinilai tidak homogen. Pertimbangkan Welch, transformasi, atau metode robust/nonparametrik sesuai desain."}, "t_one": {"goal": "Menguji apakah rerata satu sampel berbeda dari nilai pembanding μ₀.", "concept": "t = (rerata sampel − μ₀) ÷ standard error. Derajat bebas df = N − 1. Cohen’s d menyatakan besar selisih dalam satuan SD.", "read": "Baca arah selisih rerata, interval kepercayaan, p-value, lalu ukuran efek. Signifikansi statistik tidak selalu berarti perbedaan penting secara kimia."}, "t_ind": {"goal": "Membandingkan rerata dua kelompok independen.", "concept": "Welch t tidak memaksakan varians kedua kelompok sama dan menghitung standard error dari varians masing-masing kelompok. Cohen’s d menunjukkan besar perbedaan terstandar.", "read": "Periksa N, rerata, dan SD tiap kelompok; lalu baca arah t, p-value, interval/ukuran efek, serta relevansi selisih terhadap konteks pendidikan atau laboratorium."}, "t_paired": {"goal": "Membandingkan dua pengukuran yang berasal dari subjek atau unit eksperimen yang sama.", "concept": "Analisis dilakukan terhadap selisih setiap pasangan, bukan terhadap dua kelompok yang dianggap terpisah. t = rerata selisih ÷ standard error selisih.", "read": "Tanda rerata selisih mengikuti urutan X − Y. Periksa pasangan pada tabel kerja, p-value, dan Cohen’s dz agar arah serta besar perubahan tidak tertukar."}, "anova": {"goal": "Menguji apakah sedikitnya satu rerata berbeda di antara tiga atau lebih kelompok independen.", "concept": "F = mean square antarkelompok ÷ mean square dalam kelompok. Eta squared menunjukkan proporsi keragaman total yang terkait dengan faktor kelompok.", "read": "Jika uji F signifikan, lanjutkan ke post-hoc untuk mengetahui pasangan kelompok yang berbeda. ANOVA signifikan tidak berarti semua kelompok berbeda."}, "pearson": {"goal": "Mengukur arah dan kekuatan hubungan linear antara dua variabel numerik.", "concept": "Pearson r menstandarkan kovariansi menjadi rentang −1 sampai +1. Nilai positif berarti searah, nilai negatif berarti berlawanan.", "read": "Baca tanda, besar |r|, dan p-value. Periksa scatterplot dan pencilan; korelasi tidak membuktikan sebab-akibat."}, "spearman": {"goal": "Mengukur hubungan monotonik dua variabel menggunakan peringkat.", "concept": "Nilai asli diubah menjadi rank, kemudian hubungan antar-rank dihitung. Metode ini lebih tahan terhadap pencilan dan tidak mensyaratkan hubungan linear.", "read": "Baca arah dan kekuatan rho serta p-value. Hubungan dapat monotonik tetapi tidak linear; periksa scatterplot untuk memahaminya."}, "kendall": {"goal": "Mengukur kesesuaian urutan pasangan data berdasarkan pasangan concordant dan discordant.", "concept": "Kendall tau membandingkan pasangan yang urutannya searah dengan pasangan yang berlawanan, dengan penyesuaian terhadap ties.", "read": "Nilai tau mendekati +1 menunjukkan urutan sangat searah, mendekati −1 sangat berlawanan, dan mendekati 0 menunjukkan hubungan urutan yang lemah."}, "regression": {"goal": "Memodelkan nilai Y dari satu atau lebih prediktor numerik dan menilai kontribusi masing-masing prediktor.", "concept": "Koefisien B menyatakan perubahan rata-rata Y untuk kenaikan satu satuan prediktor ketika prediktor lain tetap. R² menyatakan proporsi variasi Y yang diterangkan model.", "read": "Mulai dari uji F model dan R², lalu baca koefisien, standard error, t, p-value, dan interval kepercayaan. Periksa residual sebelum memakai model untuk prediksi."}, "mann_whitney": {"goal": "Membandingkan kecenderungan distribusi dua kelompok independen menggunakan peringkat.", "concept": "Semua nilai digabung dan diberi rank. Statistik U berasal dari jumlah rank masing-masing kelompok; rank-biserial membantu membaca besar dan arah efek.", "read": "Jika bentuk distribusi kedua kelompok serupa, hasil sering ditafsirkan sebagai perbedaan lokasi/median. Jika bentuknya berbeda, tafsirkan sebagai perbedaan distribusi secara umum."}, "wilcoxon": {"goal": "Membandingkan dua pengukuran berpasangan tanpa mengandalkan asumsi normalitas selisih.", "concept": "Selisih nol dibuang, nilai absolut selisih diberi rank, lalu rank bertanda positif dan negatif dibandingkan.", "read": "Periksa arah selisih pada tabel kerja, jumlah rank positif/negatif, statistik W, dan p-value. Interpretasi median memerlukan bentuk distribusi selisih yang masuk akal."}, "kruskal": {"goal": "Membandingkan tiga atau lebih kelompok independen menggunakan peringkat.", "concept": "Semua nilai digabung dan diberi rank; statistik H membandingkan rerata rank antarkelompok. Epsilon squared memberikan ukuran efek.", "read": "Jika H signifikan, baca post-hoc terkoreksi Holm untuk mengetahui pasangan yang berbeda. Uji omnibus saja tidak menunjukkan pasangan penyebabnya."}, "friedman": {"goal": "Membandingkan tiga atau lebih pengukuran berpasangan pada subjek/unit yang sama.", "concept": "Setiap baris diberi rank antar-kondisi. Statistik chi-square Friedman menguji perbedaan rank; Kendall’s W menunjukkan kekuatan kesepakatan/perbedaan.", "read": "Jika signifikan, lanjutkan dengan perbandingan berpasangan terkoreksi. Periksa rerata rank untuk melihat kondisi yang cenderung lebih tinggi."}, "chi_square": {"goal": "Menguji apakah dua variabel kategorik saling berhubungan.", "concept": "Frekuensi harapan dihitung dari total baris × total kolom ÷ total keseluruhan. Kontribusi sel adalah (observasi − harapan)² ÷ harapan dan dijumlahkan menjadi χ².", "read": "Bandingkan tabel observasi dan harapan, lihat sel dengan kontribusi besar, kemudian baca p-value dan Cramér’s V. Periksa syarat frekuensi harapan."}, "anova2": {"goal": "Menguji dua faktor kategorik sekaligus, termasuk apakah pengaruh satu faktor berubah menurut faktor lain.", "concept": "Model memisahkan efek utama faktor A, efek utama faktor B, interaksi A×B, dan galat. Interaksi harus dibaca sebelum menyimpulkan efek utama.", "read": "Mulai dari interaksi. Jika signifikan, bandingkan pola kombinasi taraf dan hindari menafsirkan efek utama sendirian."}, "anova3": {"goal": "Menguji tiga faktor kategorik beserta interaksi dua arah dan tiga arah.", "concept": "Model memuat A, B, C, seluruh interaksi dua faktor, dan interaksi A×B×C. Partial eta squared menunjukkan besar efek relatif terhadap galat.", "read": "Baca interaksi tertinggi lebih dahulu, lalu interaksi dua arah dan efek utama yang masih dapat ditafsirkan."}, "anova4": {"goal": "Menguji empat faktor kategorik dan seluruh pola interaksi sampai empat arah.", "concept": "Empat arah memerlukan setiap kombinasi faktor terwakili dan replikasi memadai. Kompleksitas interaksi meningkat cepat.", "read": "Prioritaskan hipotesis yang direncanakan, interaksi tingkat tinggi, ukuran efek, dan grafik rerata sel. Jangan menafsirkan banyak p-value tanpa konteks."}, "ancova": {"goal": "Membandingkan kelompok setelah mengontrol satu atau lebih kovariat numerik.", "concept": "ANCOVA menggabungkan ANOVA dan regresi. Efek kelompok dinilai pada tingkat kovariat yang sama; asumsi kemiringan regresi homogen perlu diperiksa.", "read": "Baca efek kovariat, lalu efek kelompok terkontrol dan partial eta squared. Periksa hubungan linear serta interaksi kelompok×kovariat secara diagnostik."}, "point_biserial": {"goal": "Mengukur hubungan antara satu variabel biner dan satu variabel numerik.", "concept": "Point-biserial setara dengan korelasi Pearson ketika variabel biner dikodekan 0/1. Tanda bergantung pada kategori yang dijadikan kode 1.", "read": "Periksa rerata dua kategori, pengkodean 0/1, arah r_pb, p-value, dan besar perbedaan praktis."}, "partial_corr": {"goal": "Mengukur hubungan X dan Y setelah pengaruh linear variabel kontrol disisihkan.", "concept": "X dan Y masing-masing diregresikan pada kontrol. Korelasi dihitung antara kedua residual.", "read": "Bandingkan korelasi parsial dengan hubungan kasar, tetapi jangan menganggap kontrol statistik otomatis membuktikan sebab-akibat."}, "poly_regression": {"goal": "Memodelkan hubungan melengkung antara X dan Y dengan suku X², X³, atau X⁴.", "concept": "X dipusatkan sebelum pangkat dibentuk untuk mengurangi kolinearitas. Koefisien pangkat menjelaskan kelengkungan, bukan efek terpisah biasa.", "read": "Baca R² adjusted, uji model, koefisien suku tertinggi, rentang X, serta plot prediksi. Hindari ekstrapolasi di luar data."}, "nonlinear_regression": {"goal": "Mengestimasi parameter model kimia/nonlinier yang mempunyai bentuk persamaan tertentu.", "concept": "Parameter dicari dengan meminimalkan kuadrat residual. Model tersedia: Michaelis–Menten, eksponensial, dan kurva logistik.", "read": "Nilai kewajaran parameter dan intervalnya, RMSE, residual, serta kesesuaian bentuk model dengan mekanisme; jangan hanya mengejar R² tinggi."}, "logistic_regression": {"goal": "Memprediksi peluang kejadian biner dari satu atau lebih prediktor.", "concept": "Koefisien bekerja pada log-odds; exp(B) adalah odds ratio. OR >1 menaikkan odds kategori yang dikodekan 1.", "read": "Periksa pengkodean hasil, OR dan CI 95%, p-value, pseudo-R², kalibrasi, dan jangan memakai akurasi saja."}, "pca": {"goal": "Mereduksi banyak variabel berkorelasi menjadi beberapa komponen utama.", "concept": "PCA pada z-score mencari kombinasi linear yang memaksimalkan varians. Loading menunjukkan kontribusi variabel pada komponen.", "read": "Baca persentase varians, loading besar dan tanda relatifnya. Komponen harus diberi makna berdasarkan variabel, bukan secara otomatis."}, "fisher_exact": {"goal": "Menguji hubungan dua variabel biner pada tabel 2×2, terutama ketika sampel kecil.", "concept": "Fisher menghitung probabilitas tepat dari tabel dengan margin tetap dan tidak bergantung pada aproksimasi chi-square.", "read": "Baca odds ratio, p-value, arah asosiasi, dan sel tabel. Odds ratio tak hingga dapat muncul bila ada sel nol."}, "mcnemar": {"goal": "Menguji perubahan kategori biner pada unit yang sama sebelum dan sesudah perlakuan.", "concept": "McNemar hanya menggunakan pasangan discordant: berubah 0→1 versus 1→0.", "read": "Bandingkan dua sel discordant dan p-value. Sel diagonal menunjukkan tidak berubah dan tidak menentukan statistik utama."}};

function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function fmt(v,d=5){if(v===null||v===undefined||Number.isNaN(+v))return 'NaN';v=+v;if(!Number.isFinite(v))return v>0?'∞':'-∞';if(v!==0&&Math.abs(v)<10**(-d))return v.toExponential(3);return v.toFixed(d).replace(/0+$/,'').replace(/\.$/,'')}
function pText(p){return p<.001?'p < 0,001':`p = ${p.toFixed(4).replace('.',',')}`}
function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN}
function sum(a){return a.reduce((s,x)=>s+x,0)}
function variance(a,ddof=1){if(a.length<=ddof)return NaN;const m=mean(a);return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-ddof)}
function sd(a){return Math.sqrt(variance(a,1))}
function median(a){if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function quantile(a,q){if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),p=(b.length-1)*q,i=Math.floor(p),f=p-i;return b[i]+(b[Math.min(i+1,b.length-1)]-b[i])*f}
function skew(a){const n=a.length,m=mean(a),s=sd(a);if(n<3||!s)return NaN;return n/((n-1)*(n-2))*sum(a.map(x=>((x-m)/s)**3))}
function kurt(a){const n=a.length,m=mean(a),s=sd(a);if(n<4||!s)return NaN;const s4=sum(a.map(x=>((x-m)/s)**4));return n*(n+1)/((n-1)*(n-2)*(n-3))*s4-3*(n-1)**2/((n-2)*(n-3))}
function numeric(v){if(v===null||v===undefined||v==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function cleanNum(a){return a.map(numeric).filter(v=>v!==null)}
function unique(a){return [...new Set(a.filter(v=>v!==null&&v!==undefined&&v!==''))]}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function effect(v,c=[.2,.5,.8]){const a=Math.abs(v);return a<c[0]?'sangat kecil':a<c[1]?'kecil':a<c[2]?'sedang':'besar'}
function columns(){return state.data.length?Object.keys(state.data[0]):[]}
function col(name){return state.data.map(r=>r[name])}
function numCol(name){return cleanNum(col(name))}
function pairs(x,y){return state.data.map(r=>[numeric(r[x]),numeric(r[y])]).filter(r=>r[0]!==null&&r[1]!==null)}
function groupArrays(value,group){const map=new Map();state.data.forEach(r=>{const v=numeric(r[value]),g=r[group];if(v!==null&&g!==''&&g!==null&&g!==undefined){if(!map.has(String(g)))map.set(String(g),[]);map.get(String(g)).push(v)}});return [...map.entries()].filter(x=>x[1].length>=2)}
function rank(values){const a=values.map((v,i)=>({v,i})).sort((x,y)=>x.v-y.v),out=Array(values.length);let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1].v===a[i].v)j++;const rr=(i+j+2)/2;for(let k=i;k<=j;k++)out[a[k].i]=rr;i=j+1}return out}
function pearson(a,b){const ma=mean(a),mb=mean(b);let sxy=0,sxx=0,syy=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;sxy+=x*y;sxx+=x*x;syy+=y*y}return sxy/Math.sqrt(sxx*syy)}
function normalP(z){return 2*(1-jStat.normal.cdf(Math.abs(z),0,1))}
function tP(t,df){return 2*(1-jStat.studentt.cdf(Math.abs(t),df))}
function fP(f,df1,df2){return 1-jStat.centralF.cdf(f,df1,df2)}
function chiP(x,df){return 1-jStat.chisquare.cdf(x,df)}
function safeInv(m){try{return numeric.inv(m)}catch(e){throw new Error('Matriks singular. Periksa kolinearitas atau kategori yang tidak memiliki variasi.')}}
function transpose(m){return numeric.transpose(m)}
function mmul(a,b){return numeric.dot(a,b)}
function ols(X,y,names=[]){const n=y.length,p=X[0].length;if(n<=p)throw new Error('Jumlah baris valid tidak cukup untuk model.');const Xt=transpose(X),XtX=mmul(Xt,X),inv=safeInv(XtX),beta=mmul(mmul(inv,Xt),y),fit=X.map(r=>sum(r.map((v,j)=>v*beta[j]))),res=y.map((v,i)=>v-fit[i]),sse=sum(res.map(v=>v*v)),ym=mean(y),sst=sum(y.map(v=>(v-ym)**2)),df=n-p,s2=sse/df,cov=inv.map(row=>row.map(v=>v*s2)),se=cov.map((r,i)=>Math.sqrt(Math.max(0,r[i]))),t=beta.map((b,i)=>b/se[i]),pv=t.map(v=>tP(v,df)),r2=sst?1-sse/sst:NaN,adj=1-(1-r2)*(n-1)/df,msr=(sst-sse)/(p-1||1),F=msr/s2,Fp=p>1?fP(F,p-1,df):NaN;return {beta,fit,res,sse,sst,df,se,t,pv,r2,adj,F,Fp,n,p,names,cov}}
function htmlTable(rows,max=200){if(!rows||!rows.length)return '<div class="note">Tidak ada tabel.</div>';const keys=Object.keys(rows[0]);return `<div class="table-wrap"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,max).map(r=>`<tr>${keys.map(k=>`<td>${esc(typeof r[k]==='number'?fmt(r[k],5):r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>max?`<div style="color:var(--muted);font-size:12px;margin-top:6px">Ditampilkan ${max} dari ${rows.length} baris.</div>`:''}`}

function showGuide(){activate('guide','Panduan Lengkap');let methods='';for(const [group,keys] of Object.entries(GROUPS)){methods+=`<section class="guide-section" id="g-${slug(group)}"><h2>${esc(group)}</h2>`;for(const k of keys){const g=GUIDES[k];methods+=`<article class="method-card" id="m-${k}"><h3>${esc(METHODS[k][0])}</h3><p><b>Tujuan:</b> ${esc(g.goal)}</p><p><b>Konsep:</b> ${esc(g.concept)}</p><p><b>Cara membaca:</b> ${esc(g.read)}</p></article>`}methods+='</section>'}document.getElementById('content').innerHTML=`<div class="guide-hero"><h1>Panduan Lengkap Statistika Studio</h1><p>Panduan penggunaan aplikasi web, pengelolaan data, pemilihan metode, visualisasi, interpretasi, dan ekspor hasil.</p></div><div class="card"><div class="card-title">Daftar Isi</div><div class="guide-toc"><a href="#mulai">1. Mulai Cepat</a><a href="#data-guide">2. Input & Pembersihan Data</a><a href="#pemilihan">3. Memilih Metode</a><a href="#output-guide">4. Membaca Output</a><a href="#visual-guide">5. Visualisasi</a><a href="#ekspor-guide">6. Ekspor & Proyek</a>${Object.entries(GROUPS).map(([g])=>`<a href="#g-${slug(g)}">${esc(g)}</a>`).join('')}</div></div><section class="guide-section" id="mulai"><h2>1. Mulai Cepat</h2><div class="card"><ol><li>Masukkan data melalui <b>Upload CSV/Excel</b>, <b>Tempel Data</b>, atau muat salah satu dari <b>100 Contoh Riset Kimia</b>.</li><li>Buka <b>Lihat & Bersihkan Data</b> untuk memeriksa nama kolom, tipe angka, nilai kosong, dan duplikat.</li><li>Gunakan <b>Statistik Deskriptif</b> dan <b>Visualisasi</b> sebelum uji inferensial.</li><li>Pilih metode sesuai skala data, jumlah kelompok, hubungan/komparasi, pasangan/independen, dan asumsi.</li><li>Masukkan variabel pada panel analisis, tentukan α (umumnya 0,05), lalu klik <b>Jalankan Analisis</b>.</li><li>Baca output dari tujuan → konsep → data → tabel kerja → hasil hitung → cara membaca → analisis → kesimpulan.</li></ol><div class="note">Versi web menjalankan perhitungan di browser. Data yang Anda masukkan tidak dikirim ke server oleh halaman ini.</div></div></section><section class="guide-section" id="data-guide"><h2>2. Input & Pembersihan Data</h2><div class="card"><h3>Format yang didukung</h3><p>CSV, TSV/TXT, Excel XLS/XLSX, JSON records, data tempel dari spreadsheet, dan proyek <code>.statproj</code>.</p><h3>Aturan data</h3><ul><li>Baris pertama adalah nama kolom.</li><li>Satu baris mewakili satu unit observasi.</li><li>Gunakan kolom terpisah untuk variabel hasil, kelompok, prediktor, dan ID.</li><li>Angka desimal dengan titik paling aman; deteksi numerik juga mencoba koma desimal.</li></ul><h3>Perangkat pembersihan</h3><p>Hapus duplikat, hapus baris tak lengkap, isi nilai kosong numerik dengan median, dan deteksi kolom numerik. Selalu simpan salinan data asli sebelum pembersihan permanen.</p></div></section><section class="guide-section" id="pemilihan"><h2>3. Memilih Metode</h2><div class="card">${methodChooserTable()}</div></section><section class="guide-section" id="output-guide"><h2>4. Membaca Output</h2><div class="card"><p><b>p-value</b> dibandingkan dengan α. Jika p &lt; α, H₀ ditolak; jika p ≥ α, bukti belum cukup untuk menolak H₀. Jangan menjadikan p-value satu-satunya dasar kesimpulan.</p><p><b>Ukuran efek</b> membantu menilai arti praktis. Perhatikan pula interval kepercayaan, N, data hilang, satuan, desain sampling/eksperimen, kualitas instrumen, pencilan, dan asumsi metode.</p><p><b>Korelasi tidak membuktikan sebab-akibat.</b> Hasil statistik harus dihubungkan dengan rancangan penelitian dan makna kimia atau pembelajaran kimia.</p></div></section><section class="guide-section" id="visual-guide"><h2>5. Visualisasi</h2><div class="card"><ul><li><b>Histogram:</b> bentuk distribusi dan kemungkinan pencilan.</li><li><b>Boxplot:</b> median, rentang antarkuartil, dan pencilan antarkelompok.</li><li><b>Scatter:</b> pola hubungan dua variabel numerik.</li><li><b>Bar rerata:</b> perbandingan rerata antar kategori.</li><li><b>Heatmap korelasi:</b> matriks hubungan antarvariabel numerik.</li><li><b>Q–Q plot:</b> pemeriksaan visual kedekatan distribusi dengan normal.</li></ul></div></section><section class="guide-section" id="ekspor-guide"><h2>6. Ekspor & Proyek</h2><div class="card"><p>Data dapat diekspor ke CSV, XLSX, TXT/TSV, JSON, dan HTML. Hasil analisis dapat disimpan menjadi TXT atau laporan HTML. Grafik dapat disimpan sebagai PNG. Proyek <code>.statproj</code> menyimpan data dan metadata agar dapat dibuka kembali.</p></div></section>${methods}${downloadPanel()}<div class="footer">Panduan Statistika Studio 2.1.0 • © 2026 Kasmui</div>`}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function methodChooserTable(){const rows=[['Tujuan','Kondisi','Metode'],['Ringkas satu/lebih variabel','Numerik','Statistik deskriptif'],['Bandingkan satu rerata dengan nilai acuan','Numerik','Uji t satu sampel'],['Bandingkan 2 kelompok independen','Numerik, parametrik','Welch t'],['Bandingkan 2 pengukuran berpasangan','Numerik, parametrik','t berpasangan'],['Bandingkan ≥3 kelompok independen','Numerik, parametrik','ANOVA satu arah'],['Dua–empat faktor kategorik','Desain faktorial','ANOVA 2/3/4 arah'],['Bandingkan kelompok + kontrol kovariat','Hasil numerik','ANCOVA'],['Hubungan dua numerik','Linear','Pearson'],['Hubungan monotonik/peringkat','Ordinal/non-normal','Spearman/Kendall'],['Prediksi hasil numerik','Satu/lebih prediktor','Regresi linear/polinomial/nonlinier'],['Prediksi hasil biner','Status 0/1','Regresi logistik'],['Reduksi banyak indikator','Variabel numerik berkorelasi','PCA'],['2 kelompok independen nonparametrik','Ordinal/non-normal','Mann–Whitney'],['2 pengukuran berpasangan nonparametrik','Ordinal/non-normal','Wilcoxon'],['≥3 kelompok independen nonparametrik','Ordinal/non-normal','Kruskal–Wallis'],['≥3 pengukuran berpasangan','Ordinal/non-normal','Friedman'],['Hubungan dua kategorik','Tabel kontingensi','Chi-square/Fisher'],['Perubahan status biner berpasangan','Sebelum–sesudah','McNemar']];return htmlTable(rows.slice(1).map(r=>({Tujuan:r[0],Kondisi:r[1],Metode:r[2]})),50)}

function openPaste(){activate('paste','Tempel Data');document.getElementById('pasteModal').classList.add('open');setTimeout(()=>document.getElementById('pasteArea').focus(),50)}
function closePaste(){document.getElementById('pasteModal').classList.remove('open');if(state.active==='paste')showDashboard()}
function importPastedData(){const raw=document.getElementById('pasteArea').value.trim();if(!raw)return toast('Kotak data masih kosong.');const parsed=Papa.parse(raw,{header:true,dynamicTyping:false,skipEmptyLines:true});if(parsed.errors.length&&parsed.data.length===0)return toast('Data tidak dapat dibaca.');setData(parsed.data,'Data tempel');closePaste();showData()}
function setData(rows,name){if(!rows||!rows.length)throw new Error('Data tidak memiliki baris yang dapat dibaca.');const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];state.data=rows.map(r=>Object.fromEntries(keys.map((k,i)=>[String(k).trim()||`Kolom_${i+1}`,r[k]??''])));state.source=name;state.currentResult=null;state.currentExample=null;updateBadge()}

async function handleFile(file){if(!file)return;loading(true);try{const ext=file.name.toLowerCase().split('.').pop();if(ext==='statproj'){await openProjectFile(file);showData();return}let rows=[];if(['xlsx','xls'].includes(ext)){const ab=await file.arrayBuffer(),wb=XLSX.read(ab,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}else if(ext==='json'){const obj=JSON.parse(await file.text());rows=Array.isArray(obj)?obj:(obj.data||[])}else{const txt=await file.text(),p=Papa.parse(txt,{header:true,dynamicTyping:false,skipEmptyLines:true});rows=p.data}setData(rows,file.name);showData();toast('Data berhasil dibuka.')}catch(e){alert('Gagal membuka data: '+e.message)}finally{loading(false);document.getElementById('fileInput').value=''}}

function showData(){activate('data','Lihat & Bersihkan Data');const rows=state.data.slice(0,200);document.getElementById('content').innerHTML=`${dashboardMetrics()}<div class="card"><div class="card-title">Perangkat Data</div><div class="tool-row"><button class="btn soft small" onclick="removeDuplicates()">Hapus duplikat</button><button class="btn soft small" onclick="dropMissing()">Hapus baris tak lengkap</button><button class="btn soft small" onclick="fillMedian()">Isi numerik dengan median</button><button class="btn soft small" onclick="detectNumeric()">Deteksi angka</button><button class="btn soft small" onclick="state.data=sampleData();state.source='Data contoh';showData()">Batalkan: data contoh</button></div></div><div class="card"><div class="card-title">Pratinjau data — 200 baris pertama</div>${htmlTable(rows,200)}</div><div class="footer">Data aktif: ${esc(state.source)}</div>`}
function rowKey(r){return JSON.stringify(r)}
function removeDuplicates(){const before=state.data.length,m=new Map();state.data.forEach(r=>m.set(rowKey(r),r));state.data=[...m.values()];toast(`${before-state.data.length} baris duplikat dihapus.`);showData()}
function dropMissing(){if(!confirm('Hapus semua baris yang memiliki setidaknya satu nilai kosong?'))return;const before=state.data.length,cs=columns();state.data=state.data.filter(r=>cs.every(c=>r[c]!==''&&r[c]!==null&&r[c]!==undefined));toast(`${before-state.data.length} baris dihapus.`);showData()}
function fillMedian(){let count=0;for(const c of columns()){const vals=col(c),nums=cleanNum(vals);if(!nums.length)continue;const ratio=nums.length/vals.filter(x=>x!==''&&x!==null&&x!==undefined).length;if(ratio<.9)continue;const med=median(nums);state.data.forEach(r=>{if(r[c]===''||r[c]===null||r[c]===undefined){r[c]=med;count++}})}toast(`${count} nilai kosong numerik diisi median.`);showData()}
function detectNumeric(){const changed=[];for(const c of columns()){const vals=col(c),non=vals.filter(x=>x!==''&&x!==null&&x!==undefined);if(!non.length)continue;const conv=non.map(numeric).filter(x=>x!==null);if(conv.length/non.length>=.9){state.data.forEach(r=>{const n=numeric(r[c]);if(n!==null)r[c]=n});changed.push(c)}}toast('Dikonversi: '+(changed.join(', ')||'tidak ada kolom'));showData()}

function showResearchExamples(){activate('research_examples','100 Contoh Data Riset Kimia');const domains=['Semua','Pendidikan Kimia','Kimia Laboratorium'];document.getElementById('content').innerHTML=`<div class="section-layout"><div class="card sticky-card"><div class="card-title">Pilih Dataset</div><div class="formgroup"><label>Bidang</label><select id="exDomain" class="select" onchange="refreshExamples()">${domains.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="formgroup"><label>Contoh riset</label><select id="exSelect" class="select" onchange="exampleDetail()"></select></div><div id="exDetail" class="note" style="margin:12px 0"></div><button class="btn primary" style="width:100%;margin-bottom:8px" onclick="loadSelectedExample(true)">Muat Data dan Analisis Otomatis</button><button class="btn soft" style="width:100%" onclick="loadSelectedExample(false)">Muat Data Saja</button></div><div class="card"><div class="card-title">Katalog 50 Pendidikan Kimia + 50 Kimia Laboratorium</div><div class="catalog">${EXAMPLES.map(e=>`<div class="research-item"><span class="pill">${e.id}</span><strong>${esc(e.title)}</strong><small>${esc(e.method_label)} • ${esc(e.domain)}</small><p>${esc(e.description)}</p><button class="btn soft small" onclick="selectExample('${e.id}')">Pilih</button></div>`).join('')}</div></div></div>`;refreshExamples()}
function refreshExamples(){const d=document.getElementById('exDomain').value,items=EXAMPLES.filter(e=>d==='Semua'||e.domain===d),sel=document.getElementById('exSelect');sel.innerHTML=items.map(e=>`<option value="${e.id}">${e.id} | ${esc(e.title)}</option>`).join('');exampleDetail()}
function exampleDetail(){const id=document.getElementById('exSelect')?.value,e=EXAMPLES.find(x=>x.id===id);if(!e)return;document.getElementById('exDetail').innerHTML=`<b>${e.id}. ${esc(e.title)}</b><br>Bidang: ${esc(e.domain)}<br>Metode: ${esc(e.method_label)}<br><br>${esc(e.description)}<br><br><small>Dataset sintetis dan deterministik untuk latihan.</small>`}
function selectExample(id){const e=EXAMPLES.find(x=>x.id===id);document.getElementById('exDomain').value=e.domain;refreshExamples();document.getElementById('exSelect').value=id;exampleDetail();scrollTo({top:0,behavior:'smooth'})}
function loadSelectedExample(auto){const id=document.getElementById('exSelect').value,e=EXAMPLES.find(x=>x.id===id);state.data=generateExample(e);state.source=`${e.id} - ${e.title}`;state.currentExample=e;state.currentResult=null;if(auto)showAnalysis(e.method,e.params,true);else showData()}

function showAnalysis(method,preset=null,autorun=false){const [label,layout]=METHODS[method];activate(`analysis:${method}`,label);const cs=columns(),nums=cs.filter(c=>{const v=col(c).filter(x=>x!==''&&x!==null&&x!==undefined);return v.length&&v.filter(x=>numeric(x)!==null).length/v.length>=.8});const fields=paramFields(layout,cs,nums,preset||{});document.getElementById('content').innerHTML=`<div class="section-layout"><div class="card sticky-card"><div class="card-title">Parameter Analisis</div><div class="note" style="margin-bottom:12px">${esc(GUIDES[method].goal)}</div><form id="analysisForm" onsubmit="event.preventDefault();runAnalysis('${method}')">${fields}<button class="btn primary" style="width:100%;margin-top:10px">Jalankan Analisis</button></form></div><div><div class="card"><div class="card-title">${esc(label)}</div><p><b>Konsep:</b> ${esc(GUIDES[method].concept)}</p><p><b>Cara membaca:</b> ${esc(GUIDES[method].read)}</p></div><div id="analysisOutput" class="analysis-output"><div class="card"><div class="note">Pilih variabel dan klik “Jalankan Analisis”.</div></div></div></div></div>`;if(autorun)setTimeout(()=>runAnalysis(method),80)}
function opts(list,selected=''){return list.map(v=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('')}
function fieldSelect(name,label,list,val=''){return `<div class="formgroup"><label>${label}</label><select class="select" name="${name}">${opts(list,val)}</select></div>`}
function fieldInput(name,label,val='',type='text'){return `<div class="formgroup"><label>${label}</label><input class="input" type="${type}" name="${name}" value="${esc(val)}"></div>`}
function paramFields(layout,cs,nums,p={}){let h='';const s=(n,l,list)=>fieldSelect(n,l,['',...list],p[n]||''),i=(n,l,d,t='text')=>fieldInput(n,l,p[n]??d,t);if(['x_optional','x','x_numeric','x_reference'].includes(layout))h+=s('x','Variabel X / nilai',layout.includes('numeric')||layout==='x_reference'?nums:cs);if(['x_group','x_group_covariates','x_factors'].includes(layout)){h+=s('x','Variabel hasil / nilai',nums);h+=layout==='x_group'?s('group','Variabel kelompok',cs):''}if(['xy_numeric','xy_mixed','xy_controls','xy_degree','xy_model','xy_any'].includes(layout)){h+=s('x','Variabel X',layout==='xy_any'||layout==='xy_mixed'?cs:nums);h+=s('y','Variabel Y',layout==='xy_any'?cs:nums)}if(layout==='x_predictors'||layout==='x_predictors_binary'){h+=s('x',layout.includes('binary')?'Variabel hasil biner':'Variabel hasil (Y)',layout.includes('binary')?cs:nums);h+=i('predictors','Prediktor (pisahkan dengan koma)',p.predictors||nums.filter(x=>x!==p.x).slice(0,2).join(', '))}if(layout==='predictors')h+=i('predictors','Variabel/item (pisahkan dengan koma)',p.predictors||nums.slice(0,5).join(', '));if(layout==='x_reference')h+=i('reference','Nilai pembanding',p.reference||'0','number');if(layout==='x_factors')h+=i('predictors','Faktor kategorik (pisahkan dengan koma)',p.predictors||cs.filter(x=>x!==p.x).slice(0,parseInt(Object.keys(METHODS).find(k=>METHODS[k][1]===layout&&k.includes('anova'))?.slice(-1)||2)).join(', '));if(layout==='x_group_covariates'){h+=s('group','Variabel kelompok',cs);h+=i('predictors','Kovariat numerik (pisahkan dengan koma)',p.predictors||nums.filter(x=>x!==p.x).slice(0,1).join(', '))}if(layout==='xy_controls')h+=i('predictors','Variabel kontrol (pisahkan dengan koma)',p.predictors||nums.filter(x=>![p.x,p.y].includes(x)).slice(0,1).join(', '));if(layout==='xy_degree')h+=i('degree','Derajat polinomial (2–4)',p.degree||'2','number');if(layout==='xy_model')h+=fieldSelect('model','Model',['Michaelis-Menten','Eksponensial','Logistik'],p.model||'Michaelis-Menten');if(layout==='pca'){h+=i('predictors','Variabel numerik PCA (pisahkan dengan koma)',p.predictors||nums.slice(0,5).join(', '));h+=i('components','Jumlah komponen',p.components||'2','number')}h+=i('alpha','Taraf signifikansi α',p.alpha||'0.05','number');return h}
function formParams(){return Object.fromEntries(new FormData(document.getElementById('analysisForm')).entries())}
function runAnalysis(method){loading(true);setTimeout(()=>{try{const p=formParams(),res=analyze(method,p);state.currentResult=res;renderReport(method,p,res)}catch(e){document.getElementById('analysisOutput').innerHTML=`<div class="card"><div class="note" style="background:#fef2f2;border-color:#fecaca;color:#991b1b"><b>Analisis tidak dapat dijalankan.</b><br>${esc(e.message)}</div></div>`}finally{loading(false)}},20)}
function renderReport(method,p,res){const guide=GUIDES[method],alpha=Number(p.alpha||.05),missing=state.data.reduce((s,r)=>s+Object.values(r).filter(v=>v===''||v===null||v===undefined).length,0),roles=Object.entries(p).filter(([k,v])=>v&&k!=='alpha').map(([k,v])=>`${k}: ${v}`).join(' • ');const html=`<div class="report-header"><h2 style="margin:0 0 5px">${esc(res.title)}</h2><div style="color:var(--muted)">${state.currentExample?`Konteks: ${esc(state.currentExample.title)} • `:''}Dihitung: ${new Date().toLocaleString('id-ID')}</div></div>${reportSec('1. TUJUAN ANALISIS',`<p>${esc(guide.goal)}</p>`)}${reportSec('2. KONSEP DAN HIPOTESIS',`<p>${esc(guide.concept)}</p><p>H₀ adalah hipotesis nol sesuai metode. Keputusan memakai α = ${fmt(alpha,3)}: p &lt; α berarti H₀ ditolak; p ≥ α berarti bukti belum cukup untuk menolak H₀.</p>`)}${reportSec('3. DATA DAN VARIABEL YANG DIGUNAKAN',`<p>Sumber data aktif: <b>${state.data.length.toLocaleString('id-ID')} baris × ${columns().length} kolom</b>; total sel kosong: <b>${missing.toLocaleString('id-ID')}</b>.</p><p>${esc(roles)}</p><p>Baris tidak lengkap pada variabel analisis dikeluarkan dari perhitungan terkait; data asli di tabel aktif tidak dihapus.</p>`)}${reportSec('4. TABEL KERJA (TAHAP PERHITUNGAN)',htmlTable(res.work||[],40))}${reportSec('5. TABEL HASIL HITUNG',`${res.metrics?metricsHTML(res.metrics):''}${res.calc?htmlTable(res.calc,100):''}${res.summary?`<pre>${esc(res.summary)}</pre>`:''}`)}${reportSec('6. CARA MEMBACA HASIL',`<p>${esc(guide.read)}</p><p>Urutan membaca: N dan data hilang → statistik deskriptif/tabel kerja → statistik uji/df → p vs α → ukuran efek → makna substantif.</p>`)}${reportSec('7. ANALISIS DAN KESIMPULAN',`<h4>ANALISIS</h4><p>${esc(res.analysis)}</p><h4>KESIMPULAN</h4><p><b>${esc(res.conclusion)}</b></p><div class="note">Hasil statistik tidak boleh dipisahkan dari desain penelitian, sampling, kualitas instrumen, satuan, pencilan, asumsi metode, ketidakpastian eksperimen, dan relevansi praktis.</div>`)}<div class="card"><div class="tool-row"><button class="btn soft small" onclick="downloadResultTxt()">Simpan hasil TXT</button><button class="btn soft small" onclick="downloadResultHtml()">Simpan laporan HTML</button><button class="btn soft small" onclick="window.print()">Cetak / PDF</button></div></div>`;document.getElementById('analysisOutput').innerHTML=html;state.currentResult.reportHTML=html;state.currentResult.params=p;state.currentResult.method=method}
function reportSec(title,body){return `<section class="report-section"><h3>${title}</h3><div class="report-body">${body}</div></section>`}
function metricsHTML(m){return `<div class="result-grid">${Object.entries(m).map(([k,v])=>`<div class="result-chip"><small>${esc(k)}</small><strong>${esc(typeof v==='number'?fmt(v):v)}</strong></div>`).join('')}</div>`}

function analyze(method,p){const alpha=Number(p.alpha||.05);if(!(alpha>0&&alpha<1))throw new Error('Alpha harus antara 0 dan 1.');let r;switch(method){
case'descriptive':r=anaDescriptive(p);break;case'frequency':r=anaFrequency(p);break;case'cronbach':r=anaCronbach(p);break;case'normality':r=anaNormality(p);break;case'levene':r=anaLevene(p);break;case't_one':r=anaTOne(p);break;case't_ind':r=anaTInd(p);break;case't_paired':r=anaTPaired(p);break;case'anova':r=anaAnova(p);break;case'anova2':case'anova3':case'anova4':r=anaFactorial(method,p);break;case'ancova':r=anaAncova(p);break;case'pearson':case'spearman':case'kendall':r=anaCorrelation(method,p);break;case'point_biserial':r=anaPointBiserial(p);break;case'partial_corr':r=anaPartial(p);break;case'regression':r=anaRegression(p);break;case'poly_regression':r=anaPoly(p);break;case'nonlinear_regression':r=anaNonlinear(p);break;case'logistic_regression':r=anaLogistic(p);break;case'pca':r=anaPCA(p);break;case'mann_whitney':r=anaMann(p);break;case'wilcoxon':r=anaWilcoxon(p);break;case'kruskal':r=anaKruskal(p);break;case'friedman':r=anaFriedman(p);break;case'chi_square':r=anaChi(p);break;case'fisher_exact':r=anaFisher(p);break;case'mcnemar':r=anaMcNemar(p);break;default:throw new Error('Metode belum dikenali.')}return conclude(method,r,alpha)}

function toCSV(rows,sep=','){if(!rows.length)return '';const cs=Object.keys(rows[0]),q=v=>{const s=String(v??'');return /["\n,;\t]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};return [cs.map(q).join(sep),...rows.map(r=>cs.map(c=>q(r[c])).join(sep))].join('\n')}

async function openProjectFile(file){const zip=await JSZip.loadAsync(await file.arrayBuffer()),csv=await zip.file('data.csv').async('string'),meta=zip.file('project.json')?JSON.parse(await zip.file('project.json').async('string')):{};const p=Papa.parse(csv,{header:true,skipEmptyLines:true});setData(p.data,meta.source||file.name);state.currentExample=EXAMPLES.find(e=>e.id===meta.example)||null;toast('Proyek berhasil dibuka.')}

function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function rngNormal(r,mu=0,s=1){let u=0,v=0;while(!u)u=r();while(!v)v=r();return mu+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function choice(r,a,probs=null){if(!probs)return a[Math.floor(r()*a.length)];let z=r(),c=0;for(let i=0;i<a.length;i++){c+=probs[i];if(z<=c)return a[i]}return a[a.length-1]}
function generateExample(e){const r=mulberry32(24000+e.number),m=e.method,p=e.params,prefix=e.domain==='Pendidikan Kimia'?'S':'L',id=n=>`${prefix}${String(n+1).padStart(3,'0')}`;let rows=[];if(['t_paired','wilcoxon'].includes(m)){for(let i=0;i<48;i++){const before=rngNormal(r,prefix==='S'?65:72,8),gain=rngNormal(r,m==='t_paired'?7:4.5,4);rows.push({ID:id(i),Sebelum:+before.toFixed(2),Sesudah:+(before+gain).toFixed(2)})}}else if(['t_ind','mann_whitney'].includes(m)){for(let i=0;i<60;i++){const grp=i<30?'Kontrol':'Perlakuan',base=prefix==='S'?70:88,val=rngNormal(r,base+(i>=30?6:0),m==='t_ind'?8:11);rows.push({ID:id(i),Kelompok:grp,Nilai:+val.toFixed(2)})}}else if(['anova','kruskal','levene'].includes(m)){let k=0;['Kelompok A','Kelompok B','Kelompok C'].forEach((g,j)=>{for(let z=0;z<24;z++){const means=prefix==='S'?[68,74,81]:[78,85,93],sc=m==='levene'?[5,8,12]:[7,7,8];rows.push({ID:id(k++),Kelompok:g,Nilai:+rngNormal(r,means[j],sc[j]).toFixed(2)})}})}else if(['pearson','spearman','kendall'].includes(m)){for(let i=0;i<65;i++){const x=35+r()*60,y=18+.72*x+rngNormal(r,0,m==='pearson'?8:11);rows.push({ID:id(i),X:+x.toFixed(2),Y:+y.toFixed(2)})}}else if(m==='regression'){for(let i=0;i<80;i++){const x1=40+r()*55,x2=30+r()*70,y=12+.52*x1+.28*x2+rngNormal(r,0,6);rows.push({ID:id(i),Prediktor_1:+x1.toFixed(2),Prediktor_2:+x2.toFixed(2),Hasil:+y.toFixed(2)})}}else if(['normality','descriptive','t_one'].includes(m)){for(let i=0;i<64;i++){const mu=m==='t_one'?(prefix==='S'?79:99.45):(prefix==='S'?74:7.02),s=m==='t_one'?(prefix==='S'?6:.35):(prefix==='S'?9:.12);rows.push({ID:id(i),Nilai:+rngNormal(r,mu,s).toFixed(3)})}}else if(m==='chi_square'){for(let i=0;i<90;i++){const a=choice(r,['Kategori 1','Kategori 2','Kategori 3'],[.34,.33,.33]),prob={'Kategori 1':.75,'Kategori 2':.48,'Kategori 3':.25}[a];rows.push({ID:id(i),Kategori_A:a,Kategori_B:r()<prob?'Positif':'Negatif'})}}else if(m==='fisher_exact'){for(let i=0;i<40;i++){const a=r()<.5?'A':'B',prob=a==='A'?.75:.35;rows.push({ID:id(i),Kategori_A:a,Kategori_B:r()<prob?'Positif':'Negatif'})}}else if(m==='mcnemar'){for(let i=0;i<70;i++){const before=r()<.48?'Tidak':'Ya',after=before==='Tidak'?(r()<.30?'Ya':'Tidak'):(r()<.12?'Tidak':'Ya');rows.push({ID:id(i),Sebelum:before,Sesudah:after})}}else if(m==='friedman'){for(let i=0;i<42;i++){const z=rngNormal(r,prefix==='S'?70:82,7);rows.push({ID:id(i),Ukur_1:+(z+rngNormal(r,0,3)).toFixed(2),Ukur_2:+(z+4+rngNormal(r,0,3)).toFixed(2),Ukur_3:+(z+7+rngNormal(r,0,3)).toFixed(2)})}}else if(m==='cronbach'){for(let i=0;i<75;i++){const z=rngNormal(r);let o={ID:id(i)};for(let j=1;j<=5;j++)o[`Item_${j}`]=clamp(Math.round(3+.72*z+rngNormal(r,0,.62)),1,5);rows.push(o)}}else if(m==='frequency'){for(let i=0;i<80;i++)rows.push({ID:id(i),Kategori:choice(r,['Kategori A','Kategori B','Kategori C','Kategori D'],[.38,.29,.21,.12])})}else if(['anova2','anova3','anova4'].includes(m)){const k=Number(m.slice(-1)),reps={2:12,3:8,4:5}[k],combos=cartesian(Array.from({length:k},()=>[0,1]));let z=0;for(const co of combos)for(let rep=0;rep<reps;rep++){let o={ID:id(z++)},main=0;co.forEach((lv,j)=>{o[`Faktor_${String.fromCharCode(65+j)}`]=`Taraf ${lv+1}`;main+=(j+1)*2.2*lv});let inter=k>=2?3.5*co[0]*co[1]:0;if(k>=3)inter+=2.2*co[0]*co[1]*co[2];if(k>=4)inter+=1.8*co.reduce((a,b)=>a*b,1);o.Hasil=+((prefix==='S'?70:82)+main+inter+rngNormal(r,0,4)).toFixed(3);rows.push(o)}}else if(m==='ancova'){for(let i=0;i<72;i++){const grp=['Kontrol','Metode A','Metode B'][Math.floor(i/24)],cov=rngNormal(r,prefix==='S'?65:80,9),eff={'Kontrol':0,'Metode A':4,'Metode B':7}[grp],out=28+.58*cov+eff+rngNormal(r,0,4.5);rows.push({ID:id(i),Kelompok:grp,Kovariat:+cov.toFixed(2),Hasil:+out.toFixed(2)})}}else if(m==='point_biserial'){for(let i=0;i<70;i++){const st=r()<.52?'Ya':'Tidak',base=prefix==='S'?68:88,val=base+(st==='Ya'?6:0)+rngNormal(r,0,7);rows.push({ID:id(i),Status:st,Nilai:+val.toFixed(2)})}}else if(m==='partial_corr'){for(let i=0;i<80;i++){const c=rngNormal(r,60,10),lat=rngNormal(r),x=30+.55*c+8*lat+rngNormal(r,0,5),y=20+.42*c+.48*x+rngNormal(r,0,6);rows.push({ID:id(i),Kontrol:+c.toFixed(2),X:+x.toFixed(2),Y:+y.toFixed(2)})}}else if(m==='poly_regression'){for(let i=0;i<75;i++){const x=-3+6*i/74+rngNormal(r,0,.08),deg=Number(p.degree||2),y=(prefix==='S'?72:40)+(prefix==='S'?5:8)*x-(prefix==='S'?3.2:4.5)*x*x+(deg>=3?(prefix==='S'?1.1:1.4)*x**3:0)+rngNormal(r,0,prefix==='S'?3:2.5);rows.push({ID:id(i),X:+x.toFixed(4),Y:+y.toFixed(4)})}}else if(m==='nonlinear_regression'){for(let i=0;i<60;i++){let x,y,model=p.model||'Michaelis-Menten';if(model==='Eksponensial'){x=12*i/59;y=15+85*Math.exp(-.22*x)+rngNormal(r,0,2.2)}else if(model==='Logistik'){x=20*i/59;y=35+55/(1+Math.exp(-(x-9)/2.2))+rngNormal(r,0,2)}else{x=.2+19.8*i/59;y=105*x/(4.5+x)+rngNormal(r,0,2.3)}rows.push({ID:id(i),X:+x.toFixed(4),Y:+y.toFixed(4)})}}else if(m==='logistic_regression'){for(let i=0;i<120;i++){const x1=rngNormal(r),x2=rngNormal(r),logit=-.25+1.05*x1-.72*x2,pr=1/(1+Math.exp(-logit));rows.push({ID:id(i),Prediktor_1:+x1.toFixed(4),Prediktor_2:+x2.toFixed(4),Status:r()<pr?'Ya':'Tidak'})}}else if(m==='pca'){for(let i=0;i<90;i++){const f1=rngNormal(r),f2=rngNormal(r);rows.push({ID:id(i),V1:+(50+9*f1+rngNormal(r,0,2)).toFixed(3),V2:+(48+8*f1+rngNormal(r,0,2.5)).toFixed(3),V3:+(55+7*f2+rngNormal(r,0,2)).toFixed(3),V4:+(52+6*f2+rngNormal(r,0,2.2)).toFixed(3),V5:+(46+4*f1+4*f2+rngNormal(r,0,2.5)).toFixed(3)})}}else{rows=sampleData()}return rows}
function sampleData(){const r=mulberry32(2026),rows=[];for(let i=0;i<48;i++){const g=i<24?'Kontrol':'Perlakuan',pre=rngNormal(r,66,7),post=pre+(g==='Perlakuan'?7:2)+rngNormal(r,0,4);rows.push({ID:`S${String(i+1).padStart(3,'0')}`,Kelompok:g,Sebelum:+pre.toFixed(2),Sesudah:+post.toFixed(2),Nilai:+post.toFixed(2),Motivasi:+rngNormal(r,75,9).toFixed(2)})}return rows}

(function(){

function isAndroidApp(){return !!(window.Android && typeof Android.saveBase64File==='function')}
function androidSaveDataUrl(name,dataUrl){
  try{Android.saveBase64File(name,dataUrl);return true}catch(e){toast('Gagal menyimpan file di Android: '+e.message);return false}
}
function androidSaveBlob(name,blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{try{androidSaveDataUrl(name,reader.result);resolve(true)}catch(e){reject(e)}};
    reader.onerror=()=>reject(reader.error||new Error('Gagal membaca file'));
    reader.readAsDataURL(blob);
  });
}

// Timpa fungsi unduhan agar ekspor Blob juga benar-benar masuk folder Downloads Android.
function blobDownload(name,content,type='text/plain;charset=utf-8'){
  const blob=new Blob([content],{type});
  if(isAndroidApp()){androidSaveBlob(name,blob);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}

    if(isAndroidApp()){
      const arr=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      androidSaveBlob('data_input.xlsx',new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    }else XLSX.writeFile(wb,'data_input.xlsx');
    return;
  }
  if(kind==='csv')blobDownload('data_input.csv','\ufeff'+toCSV(state.data),'text/csv;charset=utf-8');
  else if(kind==='txt')blobDownload('data_input.txt',toCSV(state.data,'\t'));

}
